<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#1A0A2E"/>
  <!-- Esquina superior izquierda -->
  <polyline points="4,10 4,4 10,4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Esquina superior derecha -->
  <polyline points="22,4 28,4 28,10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Esquina inferior izquierda -->
  <polyline points="4,22 4,28 10,28" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Esquina inferior derecha -->
  <polyline points="22,28 28,28 28,22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Punto central -->
  <circle cx="16" cy="16" r="2.8" fill="white"/>
</svg>
